<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<rect width="1000" height="740" fill="#fff"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#0F172A">Один день Personal OS в Telegram (пример, обезличено)</text>
<rect x="200" y="56" width="600" height="644" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<path d="M200 84 Q200 56 228 56 L772 56 Q800 56 800 84 L800 104 L200 104 Z" fill="#E2E8F0"/>
<text x="500" y="86" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">Personal Assist · 1 ноября</text>

<rect x="225" y="120" width="380" height="166" rx="14" fill="#fff" stroke="#E2E8F0"/>
<g font-size="13" fill="#334155">
<text x="241" y="144" font-weight="700">Утро.</text>
<text x="241" y="164" font-weight="700">Кандидаты на фокус</text>
<text x="241" y="184" font-weight="700" fill="#64748B">Хвосты</text>
<text x="241" y="202">1. Черновик доклада</text>
<text x="241" y="222" font-weight="700" fill="#64748B">Настало время</text>
<text x="241" y="240">2. Разобрать почту</text>
<text x="241" y="260">Из кандидатов или другая задача. 1–2,</text>
<text x="241" y="278">или «сегодня ничего».</text>
</g>
<text x="595" y="278" font-size="10" text-anchor="end" fill="#94A3B8">09:00</text>

<rect x="225" y="296" width="380" height="76" rx="14" fill="#fff" stroke="#E2E8F0"/>
<g font-size="13" fill="#334155">
<text x="241" y="320">Ноябрь. Пора распланировать месяц.</text>
<text x="241" y="340">Крупные задачи режем на недели,</text>
<text x="241" y="360">лишнее сдвигаем, ставим приоритет.</text>
</g>
<text x="595" y="364" font-size="10" text-anchor="end" fill="#94A3B8">09:00</text>

<rect x="455" y="468" width="320" height="40" rx="14" fill="#DBEAFE" stroke="#93C5FD"/>
<text x="471" y="493" font-size="13" fill="#1E3A8A">Голосовое: «Беру первую, месяц вечером»</text>

<rect x="225" y="382" width="380" height="76" rx="14" fill="#FEF3C7" stroke="#FCD34D"/>
<g font-size="13" fill="#78350F">
<text x="241" y="406" font-weight="700">Коуч</text>
<text x="241" y="426">Доклад в пятницу — сегодня главный шаг.</text>
<text x="241" y="446">Почта подождёт до вечера.</text>
</g>
<text x="595" y="450" font-size="10" text-anchor="end" fill="#B45309">09:01</text>

<rect x="575" y="518" width="200" height="40" rx="14" fill="#DBEAFE" stroke="#93C5FD"/>
<text x="591" y="543" font-size="13" fill="#1E3A8A">Потратил 112 на обед</text>

<rect x="225" y="568" width="380" height="40" rx="14" fill="#fff" stroke="#E2E8F0"/>
<text x="241" y="593" font-size="13" fill="#334155">Записал: 112, Еда.</text>
<text x="595" y="600" font-size="10" text-anchor="end" fill="#94A3B8">13:42</text>

<rect x="225" y="618" width="380" height="58" rx="14" fill="#FEE2E2" stroke="#FCA5A5"/>
<g font-size="13" fill="#7F1D1D">
<text x="241" y="642">Еда выше темпа: 112 при темпе 100</text>
<text x="241" y="662">(бюджет 3000, день 1 из 30).</text>
</g>

<g font-size="12" fill="#64748B" text-anchor="end">
<text x="188" y="196">крон 9:00,</text>
<text x="188" y="212">бриф из Notion по MCP</text>
<text x="188" y="330">план месяца:</text>
<text x="188" y="346">с 1-го числа, до двух апрувов</text>
<text x="188" y="416">второй агент — коуч</text>
<text x="188" y="592">записал в Econumo по MCP</text>
<text x="188" y="642">темп бюджета:</text>
<text x="188" y="658">бюджет × день / дней в месяце</text>
</g>
<g font-size="12" fill="#64748B">
<text x="812" y="492">отвечаю голосом</text>
<text x="812" y="542">наличку пишу как есть</text>
</g>
</svg>
