<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Бот поддержки по вайбу</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Собирается за вечер. Демо прошло отлично, а в проде он только раздражает клиентов</text>
<rect x="64" y="190" width="564" height="176" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="346.0" y="258.4" font-size="26" font-weight="700" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">Выдумывает факты</text>
<text x="346.0" y="316.6" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">уверенно отвечает то, чего нет в базе</text>
<rect x="652" y="190" width="564" height="176" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="934.0" y="258.4" font-size="26" font-weight="700" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">Теряет вопрос</text>
<text x="934.0" y="316.6" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">из длинного запроса отвечает на половину</text>
<rect x="64" y="390" width="564" height="176" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="346.0" y="458.4" font-size="26" font-weight="700" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">Нет доступа к данным</text>
<text x="346.0" y="516.6" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">не видит заказ, отвечает общими словами</text>
<rect x="652" y="390" width="564" height="176" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="934.0" y="458.4" font-size="26" font-weight="700" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">Всё время зовёт человека</text>
<text x="934.0" y="516.6" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">«Соединяю с оператором…»</text>
<text x="640" y="650" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" xml:space="preserve">Все такие боты выглядят одинаково</text>
</svg>
