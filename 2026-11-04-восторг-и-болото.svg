<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Две недели — восторг, на третий месяц — болото</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Большой продукт на вайбкоде: скорость разработки во времени</text>
<line x1="120" y1="190" x2="120" y2="600" stroke="#CBD5E1" stroke-width="3"/>
<line x1="120" y1="600" x2="830" y2="600" stroke="#CBD5E1" stroke-width="3"/>
<text x="132" y="196" font-size="18" font-weight="600" fill="#64748B" text-anchor="start" xml:space="preserve">скорость разработки</text>
<line x1="120" y1="420" x2="830" y2="420" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="826" y="410" font-size="18" font-weight="700" fill="#475569" text-anchor="end" xml:space="preserve">руками</text>
<path d="M140 240 C300 225, 400 265, 520 380 S700 540, 820 560" fill="none" stroke="#EF4444" stroke-width="5"/>
<text x="150" y="232" font-size="20" font-weight="700" fill="#DC2626" text-anchor="start" xml:space="preserve">вайбкод</text>
<text x="140" y="452" font-size="17" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">ниже линии — руками было бы быстрее</text>
<text x="170" y="630" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">неделя 1</text>
<text x="310" y="630" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">неделя 2</text>
<text x="480" y="630" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">месяц 1</text>
<text x="640" y="630" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">месяц 2</text>
<text x="790" y="630" font-size="18" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">месяц 3+</text>
<rect x="870" y="190" width="346" height="410" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="894" y="304.1" font-size="22" font-weight="700" fill="#7F1D1D" text-anchor="start" xml:space="preserve">Что внутри</text>
<text x="894" y="360.8" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">• README противоречит коду</text>
<text x="894" y="388.8" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">• фикс ломает соседнее</text>
<text x="894" y="416.8" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">• агент чинит вчерашнее</text>
<text x="894" y="444.8" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">• контекст забит мусором</text>
<text x="894" y="472.8" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">• устройство не понимает</text>
<text x="894" y="500.8" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">  уже никто</text>
<text x="640" y="684" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle" xml:space="preserve">Проект не развивается, а разваливается</text>
</svg>
