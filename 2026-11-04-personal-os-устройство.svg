<text x="530" y="198" font-size="12" text-anchor="middle" fill="#1E3A8A">утро, вечер, план месяца,</text>
<text x="530" y="216" font-size="12" text-anchor="middle" fill="#1E3A8A">задачи, деньги, дневник</text>
