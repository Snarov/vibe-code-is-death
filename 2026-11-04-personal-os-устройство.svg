<text x="855" y="249" font-size="12" text-anchor="middle" fill="#64748B">свой сервер: выписки, бюджет</text>
<rect x="740" y="300" width="230" height="80" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
