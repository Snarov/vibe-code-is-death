</defs>
<rect width="1000" height="460" fill="#fff"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#0F172A">Personal OS: как устроено (схема)</text>
<text x="30" y="58" font-size="13" fill="#64748B">Агент живёт в облаке, говорит со мной через Telegram, а данные трогает только через MCP и git.</text>
