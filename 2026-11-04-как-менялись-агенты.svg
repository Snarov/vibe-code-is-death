<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Как менялись агенты</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Сначала граф рисовал инженер, потом путь стал выбирать сам агент</text>
<rect x="64" y="180" width="352" height="380" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="240.0" y="274.3" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve">сначала</text>
<text x="240.0" y="307.7" font-size="26" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">Жёсткие графы</text>
<text x="240.0" y="365.9" font-size="20" font-weight="400" fill="#334155" text-anchor="middle" xml:space="preserve">LangChain: роутер,</text>
<text x="240.0" y="393.9" font-size="20" font-weight="400" fill="#334155" text-anchor="middle" xml:space="preserve">цепочки, few-shot</text>
<text x="240.0" y="421.9" font-size="20" font-weight="400" fill="#334155" text-anchor="middle" xml:space="preserve">сценарий рисует инженер</text>
<text x="240.0" y="476.9" font-size="19" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">пример: бот саппорта</text>
<line x1="420" y1="370" x2="460" y2="370" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="464" y="180" width="352" height="380" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="640.0" y="274.3" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve">потом</text>
<text x="640.0" y="307.7" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">Кодинг-агенты</text>
<text x="640.0" y="365.9" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">читают проект,</text>
<text x="640.0" y="393.9" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">правят файлы,</text>
<text x="640.0" y="421.9" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">смотрят на ошибки</text>
<text x="640.0" y="476.9" font-size="19" font-weight="700" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">путь выбирает агент</text>
<line x1="820" y1="370" x2="860" y2="370" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="864" y="180" width="352" height="380" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
<text x="1040.0" y="275.0" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve">дальше</text>
<text x="1040.0" y="308.4" font-size="26" font-weight="700" fill="#14532D" text-anchor="middle" xml:space="preserve">Вне разработки</text>
<text x="1040.0" y="366.6" font-size="20" font-weight="400" fill="#14532D" text-anchor="middle" xml:space="preserve">тот же принцип</text>
<text x="1040.0" y="394.6" font-size="20" font-weight="400" fill="#14532D" text-anchor="middle" xml:space="preserve">без жёсткого графа</text>
<text x="1040.0" y="449.6" font-size="19" font-weight="700" fill="#14532D" text-anchor="middle" xml:space="preserve">саппорт, инфра,</text>
<text x="1040.0" y="476.2" font-size="19" font-weight="700" fill="#14532D" text-anchor="middle" xml:space="preserve">личный ассистент</text>
<text x="640" y="636" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" xml:space="preserve">Агенты общего назначения начались с разработки, а потом пошли дальше</text>
</svg>
