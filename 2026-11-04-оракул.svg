<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Тесты на пятом уровне — это оракул</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Проверка, которую агент не может подправить под свой код</text>
<rect x="64" y="180" width="212" height="110" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="170.0" y="229.5" font-size="20" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">Требование</text>
<text x="170.0" y="254.5" font-size="17" font-weight="400" fill="#334155" text-anchor="middle" xml:space="preserve">из спеки</text>
<line x1="278" y1="235" x2="297" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="299" y="180" width="212" height="110" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="405.0" y="229.5" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">Сценарий</text>
<text x="405.0" y="254.5" font-size="17" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">Given / When / Then</text>
<line x1="513" y1="235" x2="532" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="534" y="180" width="212" height="110" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="640.0" y="229.5" font-size="20" font-weight="700" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">Тест падает</text>
<text x="640.0" y="254.5" font-size="17" font-weight="400" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">кода ещё нет</text>
<line x1="748" y1="235" x2="767" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="769" y="180" width="212" height="110" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
<text x="875.0" y="229.5" font-size="20" font-weight="700" fill="#78350F" text-anchor="middle" xml:space="preserve">Человек</text>
<text x="875.0" y="254.5" font-size="17" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">одобряет красным</text>
<line x1="983" y1="235" x2="1002" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="1004" y="180" width="212" height="110" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
<text x="1110.0" y="229.5" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle" xml:space="preserve">Другая сессия</text>
<text x="1110.0" y="254.5" font-size="17" font-weight="400" fill="#14532D" text-anchor="middle" xml:space="preserve">реализует до зелёного</text>
<rect x="64" y="330" width="368" height="240" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="88" y="362.5" font-size="22" font-weight="700" fill="#334155" text-anchor="start" xml:space="preserve">Защита оракула</text>
<text x="88" y="416.8" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">сценарии и тесты закрыты</text>
<text x="88" y="443.4" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">от правок агента:</text>
<text x="88" y="470.0" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">хук, CODEOWNERS, CI</text>
<text x="88" y="523.2" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">ослабил тест — сборка падает</text>
<rect x="456" y="330" width="368" height="240" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="480" y="362.5" font-size="22" font-weight="700" fill="#334155" text-anchor="start" xml:space="preserve">Сила оракула</text>
<text x="480" y="416.8" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">подсаживаем баги</text>
<text x="480" y="443.4" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">и смотрим, ловит ли</text>
<text x="480" y="470.0" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">их набор тестов</text>
<text x="480" y="523.2" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">мутационное тестирование</text>
<rect x="848" y="330" width="368" height="240" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="872" y="362.5" font-size="22" font-weight="700" fill="#334155" text-anchor="start" xml:space="preserve">Цепочка артефактов</text>
<text x="872" y="416.8" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">намерение → спека →</text>
<text x="872" y="443.4" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">план → задачи → тест → код</text>
<text x="872" y="496.6" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">каждое требование</text>
<text x="872" y="523.2" font-size="19" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">прослеживается до теста</text>
<text x="640" y="640" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" xml:space="preserve">Спеку четвёртого уровня надо прочитать, спеку пятого можно запустить</text>
</svg>
