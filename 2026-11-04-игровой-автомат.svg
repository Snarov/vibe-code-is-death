<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Игровой автомат, только вместо жетонов — токены</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Мгновенный результат без усилий — самый дешёвый дофамин из доступных</text>
<rect x="100" y="270" width="220" height="110" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="210.0" y="333.4" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">Промпт</text>
<line x1="324" y1="325" x2="416" y2="325" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="420" y="270" width="200" height="110" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="520.0" y="333.4" font-size="26" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">Enter</text>
<line x1="624" y1="325" x2="716" y2="325" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="720" y="270" width="200" height="110" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
<text x="820.0" y="333.4" font-size="26" font-weight="700" fill="#78350F" text-anchor="middle" xml:space="preserve">Выпало?</text>
<line x1="924" y1="325" x2="986" y2="325" stroke="#22C55E" stroke-width="2.5" marker-end="url(#g)"/>
<text x="955" y="312" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle" xml:space="preserve">да</text>
<rect x="990" y="270" width="226" height="110" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
<text x="1103.0" y="321.5" font-size="26" font-weight="700" fill="#14532D" text-anchor="middle" xml:space="preserve">Дофамин</text>
<text x="1103.0" y="348.7" font-size="17" font-weight="400" fill="#14532D" text-anchor="middle" xml:space="preserve">мгновенно, без усилий</text>
<path d="M820 382 C820 500, 210 500, 210 384" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#r)"/>
<text x="515" y="522" font-size="22" font-weight="700" fill="#DC2626" text-anchor="middle" xml:space="preserve">не выпало — жмёшь ещё раз</text>
<rect x="100" y="566" width="1116" height="96" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="658.0" y="611.2" font-size="26" font-weight="600" fill="#0F172A" text-anchor="middle" xml:space="preserve">«Сделал SaaS за выходные без единой строчки кода»</text>
<text x="658.0" y="637.4" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">типичный пост в ленте</text>
</svg>
