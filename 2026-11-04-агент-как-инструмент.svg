<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Агент — не магия, а инструмент</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Сложный, уровня фотошопа или автокада: мост за первый вечер никто не спроектирует</text>
<rect x="64" y="180" width="564" height="340" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
<text x="346.0" y="249.4" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve">Уровень 4 · ещё полувайбкод</text>
<text x="346.0" y="282.8" font-size="26" font-weight="700" fill="#78350F" text-anchor="middle" xml:space="preserve">Фиксируем и переиспользуем</text>
<text x="346.0" y="343.5" font-size="21" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">MCP</text>
<text x="346.0" y="372.9" font-size="21" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">скиллы</text>
<text x="346.0" y="402.3" font-size="21" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">память</text>
<text x="346.0" y="431.7" font-size="21" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">спеки</text>
<text x="346.0" y="461.1" font-size="21" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">контекст-инжиниринг</text>
<rect x="652" y="180" width="564" height="340" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="934.0" y="249.4" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve">Уровень 5 · зрелость</text>
<text x="934.0" y="282.8" font-size="26" font-weight="700" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">Замыкаем петлю</text>
<text x="934.0" y="343.5" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">оракул: исполняемые спеки, BDD</text>
<text x="934.0" y="372.9" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">защита оракула, хуки</text>
<text x="934.0" y="402.3" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">цепочка артефактов</text>
<text x="934.0" y="431.7" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">петли обратной связи</text>
<text x="934.0" y="461.1" font-size="21" font-weight="400" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">осознанный human in the loop</text>
<rect x="64" y="550" width="1152" height="90" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="640.0" y="602.7" font-size="24" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">Процесс сразу строится AI-native: агент внутри, а не надстройкой сбоку</text>
</svg>
