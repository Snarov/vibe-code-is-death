<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Уровни использования ИИ</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">Вайбкод — третий уровень, полувайбкод — четвёртый, зрелость — с пятого</text>
<rect x="64" y="540" width="680" height="60" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="88" y="579" font-size="24" font-weight="800" fill="#334155" text-anchor="start" xml:space="preserve">1</text>
<text x="124" y="579" font-size="20" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Не используют вообще — вымирающий вид</text>
<rect x="100" y="470" width="680" height="60" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="124" y="509" font-size="24" font-weight="800" fill="#334155" text-anchor="start" xml:space="preserve">2</text>
<text x="160" y="509" font-size="20" font-weight="400" fill="#334155" text-anchor="start" xml:space="preserve">Чат для текста: подсказки, генератор ответов</text>
<rect x="136" y="400" width="680" height="60" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="160" y="439" font-size="24" font-weight="800" fill="#7F1D1D" text-anchor="start" xml:space="preserve">3</text>
<text x="196" y="439" font-size="20" font-weight="400" fill="#7F1D1D" text-anchor="start" xml:space="preserve">Агенты для кода, на несколько процентов возможностей</text>
<rect x="172" y="330" width="680" height="60" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
<text x="196" y="369" font-size="24" font-weight="800" fill="#78350F" text-anchor="start" xml:space="preserve">4</text>
<text x="232" y="369" font-size="20" font-weight="400" fill="#78350F" text-anchor="start" xml:space="preserve">MCP, скиллы, память, спеки: сюда же SDD</text>
<rect x="208" y="260" width="680" height="60" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="232" y="299" font-size="24" font-weight="800" fill="#1E3A8A" text-anchor="start" xml:space="preserve">5</text>
<text x="268" y="299" font-size="20" font-weight="400" fill="#1E3A8A" text-anchor="start" xml:space="preserve">Оракул: исполняемые спеки, BDD, верификация, хуки</text>
<rect x="244" y="190" width="680" height="60" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
<text x="268" y="229" font-size="24" font-weight="800" fill="#14532D" text-anchor="start" xml:space="preserve">6</text>
<text x="304" y="229" font-size="20" font-weight="400" fill="#14532D" text-anchor="start" xml:space="preserve">Агент на всём процессе целиком и в проде</text>
<line x1="950" y1="430" x2="828" y2="430" stroke="#EF4444" stroke-width="2.5" marker-end="url(#r)"/>
<text x="962" y="438" font-size="24" font-weight="700" fill="#DC2626" text-anchor="start" xml:space="preserve">вайбкод</text>
<line x1="950" y1="360" x2="864" y2="360" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#am)"/>
<text x="962" y="368" font-size="24" font-weight="700" fill="#B45309" text-anchor="start" xml:space="preserve">полувайбкод</text>
<path d="M940 192 H956 V318 H940" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
<text x="972" y="263" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="start" xml:space="preserve">зрелые подходы</text>
</svg>
