<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EF4444"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#22C55E"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="64" y="92" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start" xml:space="preserve">Коуч: та версия меня, которую я хочу растить</text>
<text x="64" y="134" font-size="22" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve">У человека нет одного постоянного «я»: за руль садятся разные части</text>
<circle cx="330" cy="420" r="62" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="330" y="427" font-size="18" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">за рулём</text>
<line x1="330" y1="292" x2="330" y2="356" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="240" y="234" width="180" height="56" rx="28" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.5"/>
<text x="330.0" y="268.4" font-size="20" font-weight="700" fill="#14532D" text-anchor="middle" xml:space="preserve">«стараюсь»</text>
<line x1="448" y1="420" x2="394" y2="420" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="450" y="392" width="180" height="56" rx="28" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="540.0" y="426.4" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle" xml:space="preserve">«озарение»</text>
<line x1="330" y1="548" x2="330" y2="484" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="240" y="550" width="180" height="56" rx="28" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2.5"/>
<text x="330.0" y="584.4" font-size="20" font-weight="700" fill="#334155" text-anchor="middle" xml:space="preserve">«ленюсь»</text>
<line x1="212" y1="420" x2="266" y2="420" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="30" y="392" width="180" height="56" rx="28" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
<text x="120.0" y="426.4" font-size="20" font-weight="700" fill="#7F1D1D" text-anchor="middle" xml:space="preserve">«срываюсь»</text>
<rect x="820" y="310" width="396" height="200" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
<text x="1018.0" y="377.7" font-size="30" font-weight="700" fill="#78350F" text-anchor="middle" xml:space="preserve">Коуч</text>
<text x="1018.0" y="409.4" font-size="20" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">мои принципы и установки,</text>
<text x="1018.0" y="437.4" font-size="20" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">заложенные мной;</text>
<text x="1018.0" y="465.4" font-size="20" font-weight="400" fill="#78350F" text-anchor="middle" xml:space="preserve">советует, но не решает</text>
<path d="M422 262 C600 240, 760 262, 840 306" fill="none" stroke="#22C55E" stroke-width="2.5" marker-end="url(#g)"/>
<text x="640" y="232" font-size="18" font-weight="600" fill="#15803D" text-anchor="middle" xml:space="preserve">переношу принципы сильной части</text>
<path d="M840 514 C760 600, 520 560, 392 448" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#am)"/>
<text x="660" y="612" font-size="18" font-weight="600" fill="#B45309" text-anchor="middle" xml:space="preserve">напоминает, когда за рулём другая часть</text>
<text x="640" y="684" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle" xml:space="preserve">Гурджиев: множество маленьких «я» · Канеман: быстрая и медленная системы · Минский: «общество разума»</text>
</svg>
